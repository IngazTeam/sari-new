name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Quality, security gates, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Enable the repository-pinned pnpm
        run: corepack enable
      - name: Install from the immutable lockfile
        run: pnpm install --frozen-lockfile
      - name: Block dependency advisory regressions
        run: pnpm audit:production
      - name: Type-check
        run: pnpm check
      - name: Release security and regression gates
        run: pnpm test:release
      - name: Validate the database schema history
        run: pnpm db:check
        env:
          DATABASE_URL: mysql://schema_check:schema_check@127.0.0.1:3306/schema_check
      - name: Build production artifacts
        run: pnpm build

  database-integration:
    name: Database integration gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sari_test
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://root:test-only-root-password@127.0.0.1:3306/sari_test
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Enable the repository-pinned pnpm
        run: corepack enable
      - name: Install from the immutable lockfile
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to a disposable database
        run: pnpm db:migrate
      - name: Run database integration contracts
        run: >-
          pnpm vitest run
          server/analytics.test.ts
          server/tests/analytics.test.ts
          server/tests/dashboard-analytics.test.ts
          server/auth.ratelimit.test.ts
          server/auth.passwordReset.test.ts
          server/auth.sessionRegistry.test.ts
          server/auth.loginRateLimit.test.ts
          server/auth.emailVerification.test.ts
